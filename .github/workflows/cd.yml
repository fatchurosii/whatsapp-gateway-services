name: Node.js CD

on:
  push:
    branches: [ "dev/v2" ]
  pull_request:
    branches: [ "dev/v2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Deploy using ssh
      uses: appleboy/ssh-action@v0.1.5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        username: ${{ secrets.USERNAME }}
        HOST: ${{ secrets.HOST }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          # go to the correct project directory on the remote server
          cd /home/fatchurrosii/workspace/app/services/whatsapp-gateway

          # update code, install deps and restart process manager
          git pull origin dev/v2
          git status

          # prefer npm ci in CI/deploy for reproducible installs (falls back to npm install if you prefer)
          npm ci || npm install

          pm2 restart ecosystem.config.js
          pm2 save
