name: Node.js CD

on:
  push:
    branches: ["dev/v2"]
  pull_request:
    branches: ["dev/v2"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Deploy Actions

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Deploy using ssh (install/check node v20 via nvm if needed)
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euxo pipefail
            
            cd /home/fatchurrosii/workspace/app/services/whatsapp-gateway

            git fetch --all
            git status
            git pull origin dev/v2

            nvm use 20

            # Check if node v20 is present
            node -v

            # double-check npm is available
            npm --version

            # install dependencies and restart pm2
            npm install --prefer-offline --no-audit --no-fund
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
